<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>游戏日常打卡</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1c1c1e; --sub:#8e8e93;
  --line:#e5e5ea; --accent:#3b82f6; --done:#34c759; --danger:#ff3b30;
  --radius:12px; --gap:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;
  padding-top:calc(52px + env(safe-area-inset-top));
  padding-bottom:calc(60px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
#accountBar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding-top:env(safe-area-inset-top);
  background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;height:calc(52px + env(safe-area-inset-top));
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;
}
#accountBar::-webkit-scrollbar{display:none}
.acc-tab{
  flex:0 0 auto;padding:6px 14px;margin:0 4px;border-radius:20px;
  background:var(--bg);font-size:13px;color:var(--sub);cursor:pointer;
  border:1px solid transparent;transition:.2s;user-select:none;
  display:flex;align-items:center;gap:4px;
}
.acc-tab:first-child{margin-left:12px}
.acc-tab.active{background:var(--accent);color:#fff;font-weight:600}
.acc-tab .del{font-size:14px;color:rgba(0,0,0,.35);padding:0 2px;line-height:1;}
.acc-tab.active .del{color:rgba(255,255,255,.7)}
.acc-add{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:20px;
  line-height:1;margin-right:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.page{display:none;padding:12px}
.page.active{display:block}
.section{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:var(--gap);}
.section-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.section-title .hint{font-size:11px;color:var(--sub);font-weight:400;}
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.res-item{text-align:center;padding:10px 4px;background:var(--bg);border-radius:10px;cursor:pointer;user-select:none;}
.res-icon{font-size:24px;height:30px;display:flex;align-items:center;justify-content:center;}
.res-name{font-weight:600;font-size:13px;margin-bottom:4px;}
.res-val{font-size:16px;font-weight:700;color:var(--accent);}
.res-val .add{font-size:11px;color:#34c759;margin-left:2px;font-weight:400;}
.res-sub{font-size:10px;color:var(--sub);margin-top:2px;}
.stat-row{display:flex;justify-content:space-between;font-size:13px;line-height:1.9;}
.stat-row .num{font-weight:600;color:var(--accent);}
.task{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);}
.task:last-child{border-bottom:none}
.task .check{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.task.done .check{background:var(--done);border-color:var(--done);}
.task.done .check::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
.task .name{flex:1;font-size:14px;cursor:pointer;}
.task.done .name{text-decoration:line-through;color:var(--sub);}
.task .num{width:48px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:13px;background:#fff;}
.task .del-btn{color:var(--sub);font-size:18px;padding:0 4px;cursor:pointer;background:none;border:none;}
.reward-tag{font-size:13px;color:#3b82f6;padding:3px 6px;border:1px dashed #3b82f6;border-radius:4px;cursor:pointer;}
.add-btn{width:100%;padding:10px;margin-top:8px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;color:var(--sub);font-size:20px;cursor:pointer;}
#tabBar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(60px + env(safe-area-inset-bottom));}
#tabBar button{flex:1;background:none;border:none;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;}
#tabBar button.active{color:var(--accent);font-weight:600;}
#tabBar .icon{font-size:20px;line-height:1;}
.btn{padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line);}
.btn.danger{background:var(--danger);}
.empty{color:var(--sub);text-align:center;padding:20px;font-size:13px;}
.notice{font-size:11px;color:#ff9500;font-weight:600;margin-left:5px;}
/* 周常子Tab */
.wt-subtab{flex:1;padding:8px;border:none;background:none;font-size:14px;color:var(--sub);cursor:pointer;border-radius:8px;}
.wt-subtab.active{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
/* 周常选项 */
.wt-options{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.wt-option{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;background:var(--bg);border-radius:8px;font-size:13px;user-select:none;}
.wt-option.done{text-decoration:line-through;color:var(--sub);background:#f0fdf4;}
.wt-option .wt-box{width:16px;height:16px;border-radius:4px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;cursor:pointer;}
.wt-option.done .wt-box{background:var(--done);border-color:var(--done);color:#fff;}
/* 子项目卡 */
.wt-subcard{margin-top:10px;padding:10px;background:#fafafa;border-radius:10px;border:1px solid var(--line);}
.wt-subcard-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;}
/* 商店购买 */
.wt-shop-item{padding:12px 0;border-bottom:1px solid var(--line);}
.wt-shop-item:last-child{border-bottom:none;}
.wt-shop-rewards{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.wt-reward-block{display:inline-flex;align-items:center;background:var(--bg);border-radius:8px;padding:4px;gap:2px;}
.wt-reward-block input{width:44px;text-align:center;border:none;background:#fff;border-radius:6px;padding:4px;font-size:13px;}
.wt-reward-block .r-icon{font-size:13px;color:#3b82f6;padding:4px 6px;cursor:pointer;user-select:none;}
.wt-reward-block .r-del{color:var(--sub);font-size:14px;padding:2px 4px;cursor:pointer;background:none;border:none;}
/* 活动日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px;}
.cal-head{text-align:center;font-size:11px;color:var(--sub);padding:4px 0;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-size:12px;position:relative;cursor:pointer;}
.cal-cell.empty-cell{background:transparent;}
.cal-cell.has-event{background:#e0f2fe;}
.cal-day{font-weight:500;}
.cal-dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:3px;}
.act-item{padding:10px 0;border-bottom:1px solid var(--line);}
.act-item:last-child{border-bottom:none;}
.act-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.act-name{font-size:14px;font-weight:600;cursor:pointer;}
.act-dates{font-size:11px;color:var(--sub);margin-bottom:6px;}
.act-dates input[type=date]{border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px;background:#fff;}
.act-rewards{display:flex;flex-wrap:wrap;gap:6px;}
.toggle-more{text-align:center;font-size:12px;color:var(--accent);padding:8px 0;cursor:pointer;}
/* 设置页 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
.set-row:last-child{border-bottom:none;}
.set-label{font-size:14px;}
.set-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.set-input{width:80px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:14px;}
.switch{position:relative;display:inline-block;width:44px;height:24px;}
.switch input{display:none;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px;transition:.3s;}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(20px);}
.theme-btn{padding:8px 12px;border-radius:8px;font-size:12px;margin-right:8px;cursor:pointer;border:2px solid transparent;}
.theme-btn.active{border-color:var(--accent);}
/* 自动折叠已完成区 */
.collapse-done{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
.collapse-header{font-size:13px;color:var(--sub);cursor:pointer;display:flex;justify-content:space-between;user-select:none;}
.collapse-body{display:none;margin-top:6px;}
.collapse-body.show{display:block;}
.res-val .add {
  display: inline-block;
  background: #34c759;
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 10px;
  margin-left: 4px;
  vertical-align: middle;
  font-weight: 600;
  transform: translateY(-2px);
}
.notice {
  font-size: 11px;
  color: #8e8e93 !important;
  font-weight: normal !important;
  margin-left: 5px;
}
.cal-cell {
  overflow: hidden;
  min-height: 52px;
}
.cal-cell .cal-event-name {
  font-size: 9px;
  line-height: 1.1;
  padding: 1px 2px;
  width: 88%;
  margin: 0 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  box-sizing: border-box;
}
.cal-cell .cal-day {
  font-size: 11px;
}
.cal-cell .cal-more {
  font-size: 8px;
  color: var(--sub);
}
.inline-edit {
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 2px 4px;
  font-size: inherit;
  font-family: inherit;
  background: #fff;
  color: var(--text);
  width: 100%;
  box-sizing: border-box;
  outline: none;
}
/* 全局背景层 */
#appBg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="accountBar"></div>

<div id="page-daily" class="page active"></div>
<div id="page-weekly" class="page"></div>
<div id="page-activity" class="page"></div>
<div id="page-settings" class="page"></div>

<div id="tabBar">
  <button data-tab="daily" class="active"><span class="icon">📋</span>日常</button>
  <button data-tab="weekly"><span class="icon">📅</span>周常</button>
  <button data-tab="activity"><span class="icon">🎉</span>活动</button>
  <button data-tab="settings"><span class="icon">⚙️</span>设置</button>
</div>

<script>
/* ==================== 常量与数据 ==================== */
var STORAGE_KEY = 'game_checkin_v3';
var RES_KEYS = ['勾玉','蓝票','黑蛋','黑碎'];

function defaultRes(){
  return {
    勾玉: { total:0, icon:'💎', color:'#333333', logs:[] },
    蓝票: { total:0, icon:'🎫', color:'#333333', logs:[] },
    黑蛋: { total:0, icon:'🥚', color:'#333333', logs:[] },
    黑碎: { total:0, icon:'🖤', color:'#333333', logs:[] }
  };
}
var DEFAULT_SECTIONS = [
  { id:'s1', name:'日常任务', hint:'每日0点更新', tasks:[] },
  { id:'s2', name:'悬赏任务', hint:'每日0点更新', tasks:[] },
  { id:'s3', name:'结界寄养', hint:'每日0点更新', tasks:[] }
];
function newAccountData(){
  return {
    resources: defaultRes(),
    daily: JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),
    weekly: { taskGroups:[
      {id:'w1',name:'神秘商店',options:[]},
      {id:'w2',name:'寮活动',options:[]},
      {id:'w3',name:'固定奖励',options:[]},
      {id:'w4',name:'分档奖励',options:[]},
      {id:'w5',name:'战斗及其他',options:[]}
    ]},
    activity:[],
    specialCard: { name:'特殊项目卡', done:false }
  };
}
function defaultDB(){
  return {
    accounts:[{ id:'main', name:'主号', isMain:true }],
    currentId:'main',
    data:{ main: newAccountData() },
    settings:{ autoCollapse:false }
  };
}

var DB = load();
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(!parsed.settings) parsed.settings = { autoCollapse:false };
      return parsed;
    }
  }catch(e){}
  return defaultDB();
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
function cur(){ return DB.data[DB.currentId]; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ==================== 自定义弹窗 ==================== */
function customPrompt(title, defaultValue, callback){
  var old = document.getElementById('customModal'); if(old) old.parentNode.removeChild(old);
  var overlay = document.createElement('div'); overlay.id = 'customModal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:12px;padding:16px;width:100%;max-width:400px;box-sizing:border-box;';
  var titleEl = document.createElement('div');
  titleEl.innerText = title; titleEl.style.cssText = 'font-weight:600;margin-bottom:10px;font-size:15px;color:#333;';
  var input = document.createElement('input');
  input.type = 'text'; input.value = defaultValue || '';
  input.style.cssText = 'width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box;';
  var btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:10px;margin-top:15px;';
  var cancelBtn = document.createElement('button'); cancelBtn.innerText = '取消'; cancelBtn.style.cssText = 'flex:1;padding:10px;background:#f0f0f0;color:#333;border:none;border-radius:8px;font-size:15px;';
  cancelBtn.onclick = function(){ overlay.parentNode.removeChild(overlay); };
  var okBtn = document.createElement('button'); okBtn.innerText = '确定'; okBtn.style.cssText = 'flex:1;padding:10px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:15px;';
  okBtn.onclick = function(){ var val = input.value; overlay.parentNode.removeChild(overlay); if(callback) callback(val); };
  btns.appendChild(cancelBtn); btns.appendChild(okBtn);
  box.appendChild(titleEl); box.appendChild(input); box.appendChild(btns);
  overlay.appendChild(box); document.body.appendChild(overlay);
  input.focus();
}
function customConfirm(title, callback){
  var old = document.getElementById('customModal'); if(old) old.parentNode.removeChild(old);
  var overlay = document.createElement('div'); overlay.id = 'customModal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  var box = document.createElement('div'); box.style.cssText = 'background:#fff;border-radius:12px;padding:16px;width:100%;max-width:400px;box-sizing:border-box;';
  var titleEl = document.createElement('div'); titleEl.innerText = title; titleEl.style.cssText = 'font-weight:600;margin-bottom:15px;font-size:15px;color:#333;';
  var btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:10px;';
  var cancelBtn = document.createElement('button'); cancelBtn.innerText = '取消'; cancelBtn.style.cssText = 'flex:1;padding:10px;background:#f0f0f0;color:#333;border:none;border-radius:8px;font-size:15px;';
  cancelBtn.onclick = function(){ overlay.parentNode.removeChild(overlay); };
  var okBtn = document.createElement('button'); okBtn.innerText = '确定'; okBtn.style.cssText = 'flex:1;padding:10px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:15px;';
  okBtn.onclick = function(){ overlay.parentNode.removeChild(overlay); if(callback) callback(); };
  btns.appendChild(cancelBtn); btns.appendChild(okBtn);
  box.appendChild(titleEl); box.appendChild(btns);
  overlay.appendChild(box); document.body.appendChild(overlay);
}
function closeModal(id){ var el = document.getElementById(id); if(el && el.parentNode) el.parentNode.removeChild(el); }

/* ==================== 渲染主入口 ==================== */
function render(){
  renderAccounts();
  renderDaily();
  renderWeekly();
  renderActivity();
  renderSettings();
}

/* ==================== 账号栏 ==================== */
function renderAccounts(){
  var bar = document.getElementById('accountBar');
  bar.innerHTML = '';
  DB.accounts.forEach(function(acc){
    var el = document.createElement('div');
    el.className = 'acc-tab' + (acc.id===DB.currentId?' active':'');
    el.innerHTML = '<span>' + acc.name + '</span>' + (acc.isMain ? '' : '<span class="del" data-del="' + acc.id + '">×</span>');
    el.onclick = function(e){
      if(e.target.dataset.del){
        customConfirm('删除账号「'+acc.name+'」？数据不可恢复', function(){
          deleteAccount(e.target.dataset.del);
        });
        return;
      }
      DB.currentId = acc.id; save(); render();
    };
    el.ondblclick = function(){
      customPrompt('重命名账号', acc.name, function(n){ if(n){ acc.name = n; save(); render(); } });
    };
    bar.appendChild(el);
  });
  var add = document.createElement('button');
  add.className='acc-add'; add.textContent='+';
  add.onclick = addAccount;
  bar.appendChild(add);
}
function addAccount(){
  customPrompt('新账号名称', '小号'+(DB.accounts.length), function(name){
    if(!name) return;
    var id = uid();
    DB.accounts.push({ id: id, name: name, isMain:false });
    DB.data[id] = newAccountData();
    DB.currentId = id;
    save(); render();
  });
}
function deleteAccount(id){
  DB.accounts = DB.accounts.filter(function(a){return a.id!==id;});
  delete DB.data[id];
  if(DB.currentId===id) DB.currentId = DB.accounts[0].id;
  save(); render();
}

/* ==================== 日常页 ==================== */
function renderDaily(){
  var p = document.getElementById('page-daily');
  var d = cur();
  if(!d.specialCard) d.specialCard = { name:'特殊项目卡', done:false };
  if(!d.resources) d.resources = defaultRes();
  var html = '';

  /* ----- 资源汇总 ----- */
  html += '<div class="section">';
  html += '<div class="section-title"><span>资源汇总</span>';
  html += '<div style="display:flex;gap:6px;">';
  html += '<button class="btn ghost" style="padding:4px 10px;font-size:12px;" onclick="toggleHistoryInline()">' + (d.historyOpen ? '收起 ▲' : '历史 ▼') + '</button>';
  html += '<button class="btn ghost" style="padding:4px 10px;font-size:12px;" onclick="editResources()">修改总数</button>';
  html += '</div></div>';

  html += '<div class="res-grid">';
    RES_KEYS.forEach(function(k){
    var res = d.resources[k] || { total:0, icon:'', color:'#333333', logs:[] };
    var todayAdd = getResourceSum(k, 'today');
    var addHtml = todayAdd > 0 ? '<span class="add">+' + todayAdd + '</span>' : '';
    var iconHtml = (res.icon && res.icon.indexOf('data:image') === 0)
      ? '<img src="' + res.icon + '" style="width:28px;height:28px;object-fit:contain;">'
      : (res.icon || k.charAt(0));
    html += '<div class="res-item" onclick="openResourceMenu(\'' + k + '\')">';
    html += '<div class="res-icon">' + iconHtml + '</div>';
    html += '<div class="res-name" style="color:' + (res.color||'#333') + ';">' + k + '</div>';
    html += '<div class="res-val">' + (res.total||0) + addHtml + '</div>';
    html += '</div>';
  });
  html += '</div>';
  // 内联历史面板
  if(d.historyOpen){
    html += renderHistoryInline(d);
  }
  html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line);">';
  RES_KEYS.forEach(function(k){
    var res = d.resources[k] || { icon:'', color:'#333' };
    var iconHtml = (res.icon && res.icon.indexOf('data:image') === 0)
      ? '<img src="' + res.icon + '" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;object-fit:contain;">'
      : '<span style="margin-right:4px;">' + (res.icon || k.charAt(0)) + '</span>';
    var todaySum = getResourceSum(k, 'today');
    var weekSum = getResourceSum(k, 'week');
    var monthSum = getResourceSum(k, 'month');
    html += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--sub);">';
    html += '<span>' + iconHtml + k + '</span>';
    html += '<span>今日:<b style="color:var(--accent);margin-left:4px;">' + todaySum + '</b> 本周:<b style="color:var(--accent);margin-left:4px;">' + weekSum + '</b> 本月:<b style="color:var(--accent);margin-left:4px;">' + monthSum + '</b></span>';
    html += '</div>';
  });
  html += '</div>';

  /* ----- 三个板块 ----- */
  d.daily.forEach(function(sec){

function getResourceSum(key, period){
  var d = cur();
  var res = d.resources[key];
  if(!res || !res.logs) return 0;
  
  var now = new Date();
  var todayNum = now.getFullYear() * 10000 + (now.getMonth()+1) * 100 + now.getDate();
  
  // 忽略日期，只统计最近一次连续同一天的净变动
  // 这里改成：如果今天有日志，或者最近一条日志是今天的，就统计
  var sum = 0;
  var foundToday = false;
  // 倒着遍历，找到今天（含误差）的日志
  for(var i = res.logs.length - 1; i >= 0; i--){
    var log = res.logs[i];
    var parts = log.date.split('-');
    var logNum = parseInt(parts[0]) * 10000 + parseInt(parts[1]) * 100 + parseInt(parts[2]);
    // 如果日期匹配今天，或者只差 1 天（电脑手机时间误差），都算今天
    if(logNum === todayNum || Math.abs(logNum - todayNum) <= 1){
      sum += log.amount;
      foundToday = true;
    } else if(foundToday){
      break; // 遇到不是今天的就停
    }
  }
  
  // 如果按日期找不到，fallback：直接用最后一条日志
  if(sum === 0 && res.logs.length > 0){
    sum = res.logs[res.logs.length - 1].amount;
  }
  
  return sum;
}
function getTotalSum(period){
  var sum = 0;
  RES_KEYS.forEach(function(k){ sum += getResourceSum(k, period); });
  return sum;
}
function addResourceLog(key, amount){
  var d = cur();
  if(!d.resources[key]) return;
  var todayStr = new Date().toISOString().slice(0,10);
  d.resources[key].logs = d.resources[key].logs || [];
  d.resources[key].logs.push({ date: todayStr, amount: amount });
  d.resources[key].total = Math.max(0, (d.resources[key].total||0) + amount);
  console.log('写入日志:', key, amount, '今日:', todayStr, '当前日志:', JSON.stringify(d.resources[key].logs));
}

function toggleCollapse(sid){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  sec.collapsed = !sec.collapsed; save(); render();
}
function oneClickComplete(sid){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  sec.tasks.forEach(function(t){
    if(t.noAutoComplete || t.done) return;
    t.done = true;
    var rk = getResourceKeyFromReward(t.reward);
    var count = Number(t.count) || 0;
    if(rk && count > 0){
      addResourceLog(rk, count);
      t.loggedKey = rk;
      t.loggedAmount = count;
    }
  });
  recordCheckInToday();
  save(); render();
}
function toggleTask(sid,tid){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  var t = sec.tasks.find(function(t){return t.id===tid;});
  var rk = getResourceKeyFromReward(t.reward);

  if(!t.done){
    // 打卡
    t.done = true;
    recordCheckInToday();
    if(rk && t.count){
      addResourceLog(rk, t.count);
      t.loggedAmount = t.count;
      t.loggedKey = rk;
    }
  } else {
    // 取消打卡
    t.done = false;
    if(t.loggedKey && t.loggedAmount){
      addResourceLog(t.loggedKey, -t.loggedAmount);
      t.loggedAmount = 0;
      t.loggedKey = null;
    }
  }
  save(); render();
}
function renameTask(sid,tid){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  var t = sec.tasks.find(function(t){return t.id===tid;});

function addTask(sid){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  showAddTaskModal(sid, function(data){
    sec.tasks.push({
      id: uid(),
      name: data.name,
      done: false,
      count: data.count,
      reward: data.reward,
      noAutoComplete: data.noAutoComplete,
      loggedKey: null,
      loggedAmount: 0
    });
    save(); render();
  });
}
function delTask(sid,tid){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  sec.tasks = sec.tasks.filter(function(t){return t.id!==tid;}); save(); render();
}
function setCount(sid,tid,val){
  var sec = cur().daily.find(function(s){return s.id===sid;});
  var t = sec.tasks.find(function(t){return t.id===tid;});
  var newCount = Number(val) || 0;

  // 如果任务已经打卡，且之前记录过资源日志，先扣回旧数值，再写入新数值
  if(t.done && t.loggedKey && t.loggedAmount){
    addResourceLog(t.loggedKey, -t.loggedAmount);
    addResourceLog(t.loggedKey, newCount);
    t.loggedAmount = newCount;
  }

  t.count = newCount;
  save(); render();
}

var currentTab = 'daily';
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('#tabBar button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab===tab);
  });
}
document.querySelectorAll('#tabBar button').forEach(function(b){
  b.onclick = function(){ switchTab(b.dataset.tab); };
});
var touchStartX = 0, touchStartY = 0;
document.body.addEventListener('touchstart', function(e){
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, {passive:true});
document.body.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx)<60 || Math.abs(dy)>Math.abs(dx)) return;
  var tabs = ['daily','weekly','activity','settings'];
  var i = tabs.indexOf(currentTab);
  if(dx<0 && i<tabs.length-1) switchTab(tabs[i+1]);
  if(dx>0 && i>0) switchTab(tabs[i-1]);
}, {passive:true});

/* --- 每周任务事件 --- */
function addWeeklyItem(gid){
  if(gid === 'w2'){
    customPrompt('子项目卡名称', '', function(name){
      if(!name) return;
      var g = cur().weekly.taskGroups.find(function(x){return x.id===gid;});
      if(!g.subCards) g.subCards = [];
      g.subCards.push({ id:uid(), name:name, options:[] });
      save(); render();
    });
  } else {
    showAddOptionModal('新增选项', function(data){
      var g = cur().weekly.taskGroups.find(function(x){return x.id===gid;});
      g.options.push({
        id: uid(),
        name: data.name,
        done: false,
        count: data.count,
        reward: data.reward,
        loggedKey: null,
        loggedAmount: 0
      });
      save(); render();
    });
  }
}
function findWeeklyOption(gid, oid, scid){
  var g = cur().weekly.taskGroups.find(function(x){return x.id===gid;});
  if(!g) return null;
  if(scid){
    var sc = (g.subCards||[]).find(function(x){return x.id===scid;});
    if(!sc) return null;
    return sc.options.find(function(x){return x.id===oid;});
  }
  return g.options.find(function(x){return x.id===oid;});
}
function toggleWeeklyOption(gid, oid, scid){
  var o = findWeeklyOption(gid, oid, scid);
  if(!o) return;
  var rk = getResourceKeyFromReward(o.reward);
  var count = Number(o.count) || 0;

  if(!o.done){
    o.done = true;
    if(rk && count > 0){
      addResourceLog(rk, count);
      o.loggedKey = rk;
      o.loggedAmount = count;
    }
  } else {
    o.done = false;
    if(o.loggedKey && o.loggedAmount){
      addResourceLog(o.loggedKey, -o.loggedAmount);
      o.loggedKey = null;
      o.loggedAmount = 0;
    }
  }
  save(); render();
}
function renameWeeklyOption(gid, oid, scid){
  var o = findWeeklyOption(gid, oid, scid);
  if(!o) return;
  customPrompt('重命名选项', o.name, function(n){ if(n){ o.name = n; save(); render(); } });
}
function delWeeklyOption(gid, oid, scid){
  var g = cur().weekly.taskGroups.find(function(x){return x.id===gid;});
  if(!g) return;
  if(scid){
    var sc = g.subCards.find(function(x){return x.id===scid;});
    if(sc) sc.options = sc.options.filter(function(x){return x.id!==oid;});
  } else {
    g.options = g.options.filter(function(x){return x.id!==oid;});
  }
  save(); render();
}
function renameWeeklyGroup(gid){
  var g = cur().weekly.taskGroups.find(function(x){return x.id===gid;});
  customPrompt('重命名板块', g.name, function(n){ if(n){ g.name = n; save(); render(); } });
}
function renameSubCard(gid, scid){
  var g = cur().weekly.taskGroups.find(function(x){return x.id===gid;});

function delShopReward(itemId, idx){
  var item = cur().weekly.shop.find(function(x){return x.id===itemId;});

  if(item.rewards.length === 0) item.rewards.push({ count: 0, reward: '' });
  save(); render();

function setShopRewardCount(itemId, idx, val){
  var item = cur().weekly.shop.find(function(x){return x.id===itemId;});
  if(!item) return;
  item.rewards[idx].count = Number(val)||0;
  save();
}

    var item = cur().weekly.shop.find(function(x){return x.id===itemId;});
    if(!item) return;
    item.rewards[idx].reward = val;
    save(); render();

function ensureActivityData(d){
  if(!d.activity || !d.activity.ongoing){
    d.activity = { ongoing:[], completed:[], otherIncome:[], calendarBg:'', calendarOpacity:0.1 };
  }
  if(!d.activity.otherIncome) d.activity.otherIncome = [];
  if(!d.activity.completed) d.activity.completed = [];
  if(d.activity.completedShowAll === undefined) d.activity.completedShowAll = false;
  if(d.activity.otherShowAll === undefined) d.activity.otherShowAll = false;
  if(d.activity.calendarBg === undefined) d.activity.calendarBg = '';
  if(d.activity.calendarOpacity === undefined) d.activity.calendarOpacity = 0.1;

  // 补全所有活动的基础字段
  function normalizeActivity(a){
    if(!a.id) a.id = uid();
    if(!a.name) a.name = '未命名活动';
    if(!a.start) a.start = new Date().toISOString().slice(0,10);
    if(!a.end) a.end = a.start;
    if(!a.color) a.color = '#ffffff';
    if(!a.bgColor) a.bgColor = '#3b82f6';
    if(!a.rewards) a.rewards = [{count:0, reward:''}];
    a.rewards.forEach(function(r){
      if(r.count === undefined) r.count = 0;
      if(r.reward === undefined) r.reward = '';
    });
  }
  d.activity.ongoing.forEach(normalizeActivity);
  d.activity.completed.forEach(normalizeActivity);
  d.activity.otherIncome.forEach(function(o){
    if(!o.id) o.id = uid();
    if(!o.name) o.name = '未命名收益';
    if(o.count === undefined) o.count = 0;
    if(o.reward === undefined) o.reward = '';
  });
}
function renderActivityCalendar(d){
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var firstDay = new Date(year, month, 1);
  var lastDay = new Date(year, month + 1, 0);
  var startWeekday = firstDay.getDay();
  var daysInMonth = lastDay.getDate();

  // 收集所有活动日期
  var dateMap = {};
  var allEvents = [];
  d.activity.ongoing.forEach(function(a){
    allEvents.push({ id:a.id, name:a.name, start:a.start, end:a.end, color:a.color||'#ffffff', bgColor:a.bgColor||'#3b82f6' });
  });
  d.activity.completed.forEach(function(a){
    allEvents.push({ id:a.id, name:a.name, start:a.start, end:a.end, color:a.color||'#ffffff', bgColor:a.bgColor||'#8e8e93' });
  });
  allEvents.forEach(function(ev){
    if(!ev.start || !ev.end) return;
    var s = new Date(ev.start);
    var e = new Date(ev.end);
    var cur = new Date(s);
    while(cur <= e){
      var key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
      if(!dateMap[key]) dateMap[key] = [];
      dateMap[key].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });

  var bgStyle = '';
  if(d.activity.calendarBg){
    bgStyle = 'background-image:url(' + d.activity.calendarBg + ');background-size:cover;background-position:center;';
  }
  var html = '<div style="border-radius:10px;padding:8px;' + bgStyle + 'background-color:rgba(0,0,0,' + d.activity.calendarOpacity + ');">';
  html += '<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(function(dd){
    html += '<div class="cal-head">' + dd + '</div>';
  });
  for(var i = 0; i < startWeekday; i++){
    html += '<div class="cal-cell empty-cell"></div>';
  }
  for(var day = 1; day <= daysInMonth; day++){
    var dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    var events = dateMap[dateKey] || [];
    var cls = 'cal-cell' + (events.length > 0 ? ' has-event' : '');
    html += '<div class="' + cls + '" onclick="showDayEvents(\'' + dateKey + '\')" style="padding:2px 0;position:relative;overflow:hidden;">';
    html += '<div class="cal-day" style="position:absolute;top:2px;left:4px;">' + day + '</div>';
    if(events.length > 0){
      html += '<div style="display:flex;flex-direction:column;width:100%;padding-top:14px;gap:2px;overflow:hidden;">';
      events.slice(0, 2).forEach(function(ev){
        var shortName = ev.name.length > 4 ? ev.name.slice(0, 4) + '..' : ev.name;
        var fg = ev.color || '#ffffff';
        var bg = ev.bgColor || '#3b82f6';
        html += '<div class="cal-event-name" style="color:' + fg + ';background:' + bg + ';border-radius:2px;text-align:center;">' + shortName + '</div>';
      });
      if(events.length > 2){
        html += '<div class="cal-more">+' + (events.length - 2) + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  
  html += '</div></div>';
  return html;
}

function showDayEvents(dateKey){
  var d = cur();
  var list = [];
  d.activity.ongoing.forEach(function(a){
    if(a.start && a.end && dateKey >= a.start && dateKey <= a.end) list.push({ name:a.name, tag:'进行中' });
  });
  d.activity.completed.forEach(function(a){
    if(a.start && a.end && dateKey >= a.start && dateKey <= a.end) list.push({ name:a.name, tag:'已结束' });
  });
  var msg = dateKey + '\n\n' + (list.length === 0 ? '当天无活动' : list.map(function(x){ return '· ' + x.name + '（' + x.tag + '）'; }).join('\n'));
  alert(msg);
}

function completeActivity(id){
  var a = findActivity(id, false); if(!a) return;
  // 完成时，把奖励计算进资源
  a.loggedRewards = [];
  a.rewards.forEach(function(r){
    var rk = getResourceKeyFromReward(r.reward);
    var count = Number(r.count) || 0;
    if(rk && count > 0){
      addResourceLog(rk, count);
      a.loggedRewards.push({ key: rk, amount: count });
    }
  });
  cur().activity.ongoing = cur().activity.ongoing.filter(function(x){return x.id!==id;});
  cur().activity.completed.unshift(a);
  save(); render();
}

function uncompleteActivity(id){
  var a = cur().activity.completed.find(function(x){return x.id===id;});
  if(!a) return;
  // 退回时，把之前加的奖励扣回
  if(a.loggedRewards){
    a.loggedRewards.forEach(function(lr){
      addResourceLog(lr.key, -lr.amount);
    });
    a.loggedRewards = [];
  }
  cur().activity.completed = cur().activity.completed.filter(function(x){return x.id!==id;});
  cur().activity.ongoing.unshift(a);
  save(); render();
}

function formatDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getHistoryPeriodLabel(){
  var p = historyView.period;
  var offset = historyView.offset;
  var now = new Date();
  if(p === 'day'){
    var d = new Date(now); d.setDate(d.getDate() + offset);
    var label = formatDate(d);
    if(offset === 0) label += '（今天）';
    else if(offset === -1) label += '（昨天）';
    return label;
  } else if(p === 'week'){
    var start = new Date(now);
    start.setDate(now.getDate() - now.getDay() + 1 + offset*7);
    start.setHours(0,0,0,0);
    var end = new Date(start);
    end.setDate(start.getDate() + 6);
    var l = formatDate(start) + ' ~ ' + formatDate(end);
    if(offset === 0) l += '（本周）';
    return l;
  } else {
    var m = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    var l = m.getFullYear() + '年' + (m.getMonth()+1) + '月';
    if(offset === 0) l += '（本月）';
    return l;
  }
}

function getHistoryDateRange(){
  var p = historyView.period;
  var offset = historyView.offset;
  var now = new Date();
  var start, end;
  if(p === 'day'){
    start = new Date(now); start.setDate(now.getDate() + offset); start.setHours(0,0,0,0);
    end = new Date(start); end.setHours(23,59,59,999);
  } else if(p === 'week'){
    start = new Date(now);
    start.setDate(now.getDate() - now.getDay() + 1 + offset*7);
    start.setHours(0,0,0,0);
    end = new Date(start);
    end.setDate(start.getDate() + 6); end.setHours(23,59,59,999);
  } else {
    start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    end = new Date(now.getFullYear(), now.getMonth() + offset + 1, 0, 23,59,59,999);
  }
  return { start: start, end: end };
}

function getResourceSumInRange(key, start, end){
  var d = cur();
  var res = d.resources[key];
  if(!res || !res.logs) return 0;
  var sum = 0;
  res.logs.forEach(function(log){
    var ld = new Date(log.date + 'T00:00:00');
    if(ld >= start && ld <= end) sum += log.amount;
  });
  return sum;
}

function openDatePicker(){
  var p = historyView.period;
  var now = new Date();
  // 根据当前周期和偏移，计算默认选中日期
  var defaultDate = now;
  if(p === 'day'){
    defaultDate = new Date(now); defaultDate.setDate(now.getDate() + historyView.offset);
  } else if(p === 'week'){
    defaultDate = new Date(now); defaultDate.setDate(now.getDate() - now.getDay() + 1 + historyView.offset*7);
  } else {
    defaultDate = new Date(now.getFullYear(), now.getMonth() + historyView.offset, 1);
  }

  var input = document.createElement('input');
  input.type = (p === 'month') ? 'month' : 'date';
  var valStr = (p === 'month')
    ? (defaultDate.getFullYear() + '-' + String(defaultDate.getMonth()+1).padStart(2,'0'))
    : formatDate(defaultDate);
  input.value = valStr;
  input.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';

  input.onchange = function(){
    if(!input.value){ document.body.removeChild(input); return; }
    if(p === 'day'){
      var picked = new Date(input.value + 'T00:00:00');
      var today = new Date(); today.setHours(0,0,0,0);
      var diff = Math.round((picked - today) / 86400000);
      historyView.offset = diff;
    } else if(p === 'week'){
      var picked = new Date(input.value + 'T00:00:00');
      var today = new Date(); today.setHours(0,0,0,0);
      var monday = new Date(today); monday.setDate(today.getDate() - today.getDay() + 1);
      var pickedMonday = new Date(picked); pickedMonday.setDate(picked.getDate() - picked.getDay() + 1);
      var weekDiff = Math.round((pickedMonday - monday) / (86400000*7));
      historyView.offset = weekDiff;
    } else {
      var parts = input.value.split('-');
      var pickedMonth = parseInt(parts[0],10) * 12 + parseInt(parts[1],10);
      var nowMonth = now.getFullYear() * 12 + (now.getMonth()+1);
      historyView.offset = pickedMonth - nowMonth;
    }
    document.body.removeChild(input);
    save(); render();
  };

  document.body.appendChild(input);
  // 移动端兼容
  if(input.showPicker){ try{ input.showPicker(); } catch(e){ input.click(); } }
  else { input.click(); }
}

// 通用：把元素变成输入框，编辑完成后回写
function inlineEdit(el, defaultValue, onSave){
  var oldText = el.innerText || el.textContent;
  var input = document.createElement('input');
  input.type = 'text';
  input.value = defaultValue;
  input.className = 'inline-edit';
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();
  
  var saved = false;
  function save(){
    if(saved) return;
    saved = true;
    var val = input.value.trim();
    if(val && val !== defaultValue){
      onSave(val);
    } else {
      el.innerText = oldText;
    }
  }
  input.onblur = save;
  input.onkeydown = function(e){
    if(e.key === 'Enter'){ input.blur(); }
    if(e.key === 'Escape'){ saved = true; el.innerText = oldText; }
  };
}

    html += '<div class="res-item" onclick="openResourceMenu(\'' + k + '\')">';
    html += '<div class="res-icon">' + iconHtml + '</div>';
    html += '<div class="res-name" style="color:' + (res.color||'#333') + ';">' + k + '</div>';
    html += '<div class="res-val">' + (res.total||0) + addHtml + '</div>';
    html += '</div>';
  });
  html += '</div>';

  if(d.historyOpen){
    html += renderHistoryInline(d);
  }

  html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line);">';
  RES_KEYS.forEach(function(k){
    var res = d.resources[k] || { icon:'', color:'#333' };
    var iconHtml = (res.icon && res.icon.indexOf('data:image') === 0)
      ? '<img src="' + res.icon + '" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;object-fit:contain;">'
      : '<span style="margin-right:4px;">' + (res.icon || k.charAt(0)) + '</span>';
    var todaySum = getResourceSum(k, 'today');
    var weekSum = getResourceSum(k, 'week');
    var monthSum = getResourceSum(k, 'month');
    html += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--sub);">';
    html += '<span>' + iconHtml + k + '</span>';
    html += '<span>今日:<b style="color:var(--accent);margin-left:4px;">' + todaySum + '</b> 本周:<b style="color:var(--accent);margin-left:4px;">' + weekSum + '</b> 本月:<b style="color:var(--accent);margin-left:4px;">' + monthSum + '</b></span>';
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';
  return html;
}
function changeRecordIcon(type){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = function(e){
    var file = e.target.files[0]; if(!file) return;
    if(file.size > 1024 * 100){ alert('图片不能超过100KB'); return; }
    var reader = new FileReader();
    reader.onload = function(evt){
      if(type === 'game') DB.settings.gameIcon = evt.target.result;
      else DB.settings.checkInIcon = evt.target.result;
      save(); render();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function chooseBgImage(){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      DB.settings.bgImage = evt.target.result;
      if(DB.settings.bgOpacity === undefined) DB.settings.bgOpacity = 0.3;
      if(DB.settings.bgBlur === undefined) DB.settings.bgBlur = 0;
      save(); applyTheme(); render();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function clearBgImage(){
  DB.settings.bgImage = '';
  save(); applyTheme(); render();
}

function setBgOpacity(val){
  DB.settings.bgOpacity = parseFloat(val);
  save(); applyTheme();
  render();
}

function setBgBlur(val){
  DB.settings.bgBlur = parseFloat(val);
  save(); applyTheme();
  render();
}
function previewBg(){
  var opSlider = document.getElementById('bgOpacitySlider');
  var blSlider = document.getElementById('bgBlurSlider');
  if(!opSlider || !blSlider) return;
  var op = parseFloat(opSlider.value);
  var bl = parseFloat(blSlider.value);
  document.getElementById('opacityLabel').innerText = Math.round(op*100) + '%';
  document.getElementById('blurLabel').innerText = bl + 'px';
  // 实时预览，但不保存
  var bg = document.getElementById('appBg');
  if(bg && DB.settings.bgImage){
    bg.style.opacity = op;
    bg.style.filter = 'blur(' + bl + 'px)';
  }
}

function applyBg(){
  var opSlider = document.getElementById('bgOpacitySlider');
  var blSlider = document.getElementById('bgBlurSlider');
  if(!opSlider || !blSlider) return;
  DB.settings.bgOpacity = parseFloat(opSlider.value);
  DB.settings.bgBlur = parseFloat(blSlider.value);
  save();
  customConfirm('确定应用当前背景设置吗？', function(){
    applyTheme(); render();
  });
}

function resetBgPreview(){
  var opSlider = document.getElementById('bgOpacitySlider');
  var blSlider = document.getElementById('bgBlurSlider');
  if(!opSlider || !blSlider) return;
  opSlider.value = DB.settings.bgOpacity !== undefined ? DB.settings.bgOpacity : 0.3;
  blSlider.value = DB.settings.bgBlur || 0;
  previewBg();
}
function editActivityColor(id, isCompleted, field){
  var a = findActivity(id, isCompleted);
  if(!a) return;
  var current = field === 'color' ? (a.color||'#ffffff') : (a.bgColor||'#3b82f6');
  var title = field === 'color' ? '输入字体颜色（如 #ffffff）' : '输入背景颜色（如 #3b82f6）';
  customPrompt(title, current, function(val){
    if(!val) return;
    a[field] = val;
    save(); render();
  });
}
function openActivityColorMenu(id, isCompleted){
  var a = findActivity(id, isCompleted);
  if(!a) return;
  closeModal('activityColorMenu');
  var overlay = document.createElement('div'); overlay.id = 'activityColorMenu';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';
  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:12px 12px 0 0;padding:16px;width:100%;max-width:500px;box-sizing:border-box;';
  var title = document.createElement('div'); title.innerText = '修改颜色'; title.style.cssText = 'font-weight:600;margin-bottom:12px;text-align:center;';
  box.appendChild(title);

  function makeBtn(text, fn){
    var b = document.createElement('button');
    b.innerText = text;
    b.style.cssText = 'width:100%;padding:12px;margin-bottom:8px;background:#f5f5f7;border:none;border-radius:8px;font-size:15px;';
    b.onclick = function(){ closeModal('activityColorMenu'); fn(); };
    return b;
  }
  box.appendChild(makeBtn('修改字体颜色', function(){ editActivityColor(id, isCompleted, 'color'); }));
  box.appendChild(makeBtn('修改背景颜色', function(){ editActivityColor(id, isCompleted, 'bgColor'); }));

  var cancelBtn = document.createElement('button'); cancelBtn.innerText = '取消';
  cancelBtn.style.cssText = 'width:100%;padding:12px;background:#e5e5ea;border:none;border-radius:8px;font-size:15px;';
  cancelBtn.onclick = function(){ closeModal('activityColorMenu'); };
  box.appendChild(cancelBtn);

  overlay.appendChild(box); document.body.appendChild(overlay);
}
</script>
</body>
</html>
